workflows:

  # â”€â”€ Debug APK (push to main / develop) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  android-debug:
    name: Sarrows Android Debug
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        PACKAGE_NAME: "com.sarrows.app"
        ANDROID_NDK_VERSION: "27.0.12077973"
        ANDROID_CMAKE_VERSION: "3.22.1"
        GRADLE_VERSION: "8.7"
      java: 17

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
          include: true
        - pattern: "develop"
          include: true

    scripts:
      - name: Set up sdkmanager PATH
        script: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/cmdline-tools/tools/bin:$PATH"
          echo "PATH=$PATH" >> $CM_ENV

      - name: Accept Android SDK licenses
        script: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install NDK and CMake
        script: |
          sdkmanager \
            "ndk;$ANDROID_NDK_VERSION" \
            "cmake;$ANDROID_CMAKE_VERSION" \
            --sdk_root="$ANDROID_SDK_ROOT"

      - name: Download gradle-wrapper.jar
        script: |
          mkdir -p gradle/wrapper
          curl -fsSL \
            "https://github.com/gradle/gradle/raw/refs/tags/v${GRADLE_VERSION}.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          echo "gradle-wrapper.jar downloaded ($(wc -c < gradle/wrapper/gradle-wrapper.jar) bytes)"

      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Make gradlew executable
        script: chmod +x gradlew

      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            -Pandroid.useAndroidX=true \
            -PANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"

    artifacts:
      - app/build/outputs/apk/debug/**/*.apk
      - app/build/outputs/logs/**

    publishing:
      email:
        recipients:
          - team@sarrows.app
        notify:
          success: true
          failure: true

  # â”€â”€ Release APK + AAB (push a v* tag) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  android-release:
    name: Sarrows Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        PACKAGE_NAME: "com.sarrows.app"
        ANDROID_NDK_VERSION: "27.0.12077973"
        ANDROID_CMAKE_VERSION: "3.22.1"
        GRADLE_VERSION: "8.7"
        KEYSTORE_PATH: "/tmp/sarrows-release.keystore"
        KEY_ALIAS: "sarrows"
        KEY_PASSWORD: "Sarrows@Key2025"
        STORE_PASSWORD: "Sarrows@Store2025"
        OWNER_NAME: "Sarrows"
      java: 17

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true

    scripts:
      - name: Set up sdkmanager PATH
        script: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/cmdline-tools/tools/bin:$PATH"
          echo "PATH=$PATH" >> $CM_ENV

      - name: Accept Android SDK licenses
        script: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install NDK and CMake
        script: |
          sdkmanager \
            "ndk;$ANDROID_NDK_VERSION" \
            "cmake;$ANDROID_CMAKE_VERSION" \
            --sdk_root="$ANDROID_SDK_ROOT"

      - name: Download gradle-wrapper.jar
        script: |
          mkdir -p gradle/wrapper
          curl -fsSL \
            "https://github.com/gradle/gradle/raw/refs/tags/v${GRADLE_VERSION}.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          echo "gradle-wrapper.jar downloaded ($(wc -c < gradle/wrapper/gradle-wrapper.jar) bytes)"

      - name: Generate release keystore
        script: |
          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE_PATH" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=$OWNER_NAME, OU=Android, O=Sarrows, L=Unknown, S=Unknown, C=US"
          echo "Keystore generated at $KEYSTORE_PATH"

      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Make gradlew executable
        script: chmod +x gradlew

      - name: Build Release APK
        script: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -Pandroid.useAndroidX=true \
            -PANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Build Release AAB (Play Store)
        script: |
          ./gradlew bundleRelease \
            --no-daemon \
            -Pandroid.useAndroidX=true \
            -PANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

    artifacts:
      - app/build/outputs/apk/release/**/*.apk
      - app/build/outputs/bundle/release/**/*.aab
      - app/build/outputs/mapping/release/mapping.txt
      - app/build/outputs/logs/**

    publishing:
      email:
        recipients:
          - team@sarrows.app
        notify:
          success: true
          failure: true
